name = "onegai"
main = "worker/src/index.js"
compatibility_date = "2026-09-01"

# アプリ本体は API と同じオリジンから配る。別オリジンにしないので CORS は不要。
[assets]
directory = "./docs"
binding = "ASSETS"
not_found_handling = "single-page-application"
# /api/* は静的ファイルの振り分けより先に Worker へ渡す。
# これがないと、単一ページ扱いの取りこぼし処理が API を index.html で返してしまう恐れがある。
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "onegai"
database_id = "local-development-placeholder"

# 毎日 00:00 UTC = 日本時間の朝9時。深夜に鳴らさないための時刻。
# 月曜だけ、メモの件数も受け取る側に知らせる。
[triggers]
crons = ["0 0 * * *"]

[vars]
VAPID_SUBJECT = "mailto:noreply@example.com"
# VAPID_PUBLIC_KEY は npm run vapid で作って、ここに貼る(公開してよい)
VAPID_PUBLIC_KEY = "BBsmWRiHSrif5xsmgioKzuH-nD6X517kFGXZmVsjxqtktU69SdKvbRn5UNvdx3XS933B8-6xFbO7BuX1iFGD1Qk"
# VAPID_PRIVATE_KEY は npx wrangler secret put VAPID_PRIVATE_KEY で登録する。ここには書かない。
