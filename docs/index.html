<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101613">
<title>費用メモ</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* ---------- tokens ---------- */
:root {
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --surface-raised: #F2F5F3;
  --text: #1B2B22;
  --muted: #5A6B61;
  --border: #E3E8E5;
  --edge: #D6DEDA;
  --accent: #1E8038;
  --accent-edge: #14562A;
  --accent-soft: #E8F6EC;
  --accent-ink: #1B7434;
  --on-accent: #FFFFFF;
  --positive: #1B7434;
  --positive-soft: #E8F6EC;
  --attention: #8A5A12;
  --attention-soft: #FBF0DA;
  --rest: #5A6B61;
  --rest-soft: #F2F5F3;
  --shadow: 0 2px 8px rgba(27, 43, 34, 0.12);
  --scrim: rgba(27, 43, 34, 0.45);

  --fs-xs: 0.8125rem;
  --fs-sm: 0.875rem;
  --fs-md: 1rem;
  --fs-lg: 1.125rem;
  --fs-xl: 1.375rem;
  --fs-h1: 1.625rem;
  --fs-amount: 1.375rem;
  --fs-amount-xl: 3.25rem;

  --radius: 20px;
  --radius-btn: 16px;
  --radius-sheet: 28px;
  --tap: 44px;
  --tabh: 84px;
  --sx: 20px;
  --maxw: 560px;
  --dur: 150ms;
  --dur-sheet: 200ms;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101613;
    --surface: #18211C;
    --surface-raised: #202B24;
    --text: #E8EFE9;
    --muted: #9FB0A5;
    --border: #2C3A32;
    --edge: #2C3A32;
    --accent: #4FBF6E;
    --accent-edge: #2E7A46;
    --accent-soft: #1B3324;
    --accent-ink: #7FD79A;
    --on-accent: #0C1A10;
    --positive: #7FD79A;
    --positive-soft: #1B3324;
    --attention: #E0B05C;
    --attention-soft: #33280F;
    --rest: #9FB0A5;
    --rest-soft: #202B24;
    --shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
    --scrim: rgba(0, 0, 0, 0.6);
  }
}
:root[data-theme="dark"] {
  --bg: #101613;
  --surface: #18211C;
  --surface-raised: #202B24;
  --text: #E8EFE9;
  --muted: #9FB0A5;
  --border: #2C3A32;
  --edge: #2C3A32;
  --accent: #4FBF6E;
  --accent-edge: #2E7A46;
  --accent-soft: #1B3324;
  --accent-ink: #7FD79A;
  --on-accent: #0C1A10;
  --positive: #7FD79A;
  --positive-soft: #1B3324;
  --attention: #E0B05C;
  --attention-soft: #33280F;
  --rest: #9FB0A5;
  --rest-soft: #202B24;
  --shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
  --scrim: rgba(0, 0, 0, 0.6);
}
@media (prefers-reduced-motion: reduce) {
  :root { --dur: 0ms; --dur-sheet: 0ms; }
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html { background: var(--bg); color: var(--text); }
body {
  margin: 0;
  font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  font-size: var(--fs-md);
  font-weight: 500;
  line-height: 1.6;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.amount { font-variant-numeric: tabular-nums; font-weight: 800; }
.muted { color: var(--muted); }
.sm { font-size: var(--fs-sm); }
.xs { font-size: var(--fs-xs); }

/* ---------- app frame ---------- */
#app {
  min-height: 100dvh;
  max-width: var(--maxw);
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}
@media (min-width: 600px) {
  #app { border-left: 2px solid var(--border); border-right: 2px solid var(--border); }
}
.topbar {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 60px;
  padding: 8px var(--sx);
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 2;
}
.topbar .title { font-size: var(--fs-h1); font-weight: 800; flex: 1; letter-spacing: 0.01em; }
.topbar .btn-icon { margin-left: -10px; }
.main {
  flex: 1;
  padding: 8px var(--sx) 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.bottom-action {
  position: sticky;
  bottom: var(--tabh);
  padding: 12px var(--sx);
  background: linear-gradient(to top, var(--bg) 70%, transparent);
}
.tabs {
  position: sticky;
  bottom: 0;
  display: flex;
  border-top: 2px solid var(--border);
  background: var(--surface);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabs button {
  flex: 1;
  min-height: var(--tabh);
  background: none;
  border: 0;
  color: var(--muted);
  font-size: var(--fs-xs);
  font-weight: 700;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.tabs button .icon { width: 28px; height: 28px; }
.tabs button[aria-current="page"] { color: var(--accent-ink); font-weight: 800; }

/* ---------- role switch ---------- */
.seg {
  display: inline-flex;
  border: 2px solid var(--border);
  border-radius: 999px;
  padding: 2px;
  background: var(--surface);
}
.seg button {
  min-height: 34px;
  padding: 0 14px;
  border: 0;
  border-radius: 999px;
  background: none;
  color: var(--muted);
  font-size: var(--fs-sm);
  font-weight: 700;
}
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); font-weight: 800; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: var(--tap);
  padding: 0 20px;
  border-radius: var(--radius-btn);
  border: 0;
  background: none;
  font-size: var(--fs-md);
  font-weight: 700;
  transition: opacity var(--dur), background-color var(--dur);
}
.btn:disabled { opacity: 0.45; cursor: default; }
.btn-primary { background: var(--accent); color: var(--on-accent); font-weight: 800; }
.btn-secondary { border: 2px solid var(--border); background: var(--surface); color: var(--text); }
.btn-text { color: var(--muted); padding: 0 12px; }
.btn-block { width: 100%; min-height: 60px; font-size: var(--fs-lg); }
/* 下端の厚みで「押せる」を出す。押すと沈む。 */
.btn-3d { border-bottom: 5px solid var(--accent-edge); }
.btn-3d.btn-secondary { border-bottom: 5px solid var(--edge); }
.btn-3d:not(:disabled):active { transform: translateY(3px); border-bottom-width: 2px; }
@media (prefers-reduced-motion: reduce) {
  .btn-3d:not(:disabled):active { transform: none; }
}
.btn-icon {
  width: 44px;
  height: 44px;
  border-radius: 999px;
  border: 0;
  background: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text);
}
.icon { width: 24px; height: 24px; stroke: currentColor; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- cards / sections ---------- */
.section { display: flex; flex-direction: column; gap: 12px; }
.section-title { font-size: var(--fs-md); color: var(--muted); font-weight: 700; }
.card {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.card.is-rest { opacity: 0.7; }
.card-btn {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  min-height: 60px;
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  text-align: left;
  cursor: pointer;
  border-radius: 8px;
}
.row { display: flex; align-items: center; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.col { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.card .item-title { font-size: var(--fs-lg); font-weight: 700; }
.card .item-amount { font-size: var(--fs-amount); }

/* 品目は丸の中の線画で見分ける。文字だけの一覧より一目で分かる。 */
.item-icon {
  width: 48px;
  height: 48px;
  flex-shrink: 0;
  border-radius: 999px;
  background: var(--surface-raised);
  color: var(--muted);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.item-icon.sm { width: 40px; height: 40px; }
.item-icon.sm .icon { width: 21px; height: 21px; }
.is-selected .item-icon { background: var(--surface); color: var(--accent-ink); }
.avatar {
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent-ink);
  font-size: var(--fs-lg);
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.tag {
  display: inline-block;
  font-size: var(--fs-xs);
  font-weight: 700;
  color: var(--muted);
  background: var(--rest-soft);
  border-radius: 8px;
  padding: 1px 8px;
  line-height: 1.5;
  margin-left: 8px;
  vertical-align: middle;
}
.pill {
  display: inline-block;
  font-size: var(--fs-xs);
  font-weight: 700;
  border-radius: 999px;
  padding: 3px 12px;
  line-height: 1.5;
  white-space: nowrap;
}
.pill-muted { background: var(--rest-soft); color: var(--muted); }
.pill-attention { background: var(--attention-soft); color: var(--attention); }
.pill-positive { background: var(--positive-soft); color: var(--positive); }
.pill-rest { background: var(--rest-soft); color: var(--rest); }
.empty { color: var(--muted); font-size: var(--fs-sm); padding: 20px 0; text-align: center; }
.note-box {
  background: var(--surface-raised);
  border-radius: var(--radius-btn);
  padding: 12px 14px;
  font-size: var(--fs-sm);
}
.note-box .who { color: var(--muted); font-size: var(--fs-xs); font-weight: 700; }

/* ---------- reminder ---------- */
.reminder {
  background: var(--attention-soft);
  border-radius: var(--radius);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.reminder p { font-size: var(--fs-md); font-weight: 700; }
.reminder .actions { display: flex; gap: 10px; }
.reminder .btn-secondary { background: var(--surface); }

/* ---------- check row ---------- */
.checkrow {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 52px;
  width: 100%;
  padding: 4px 0;
  background: none;
  border: 0;
  text-align: left;
  border-radius: var(--radius-btn);
  font-weight: 700;
}
.checkrow[disabled] { cursor: default; }
.checkrow .box {
  width: 32px;
  height: 32px;
  border-radius: 999px;
  border: 2px solid var(--edge);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--on-accent);
  flex-shrink: 0;
  background: var(--surface);
  transition: background-color var(--dur), border-color var(--dur);
}
.checkrow[aria-checked="true"] .box { background: var(--accent); border-color: var(--accent); }
.checkrow .box .icon { width: 18px; height: 18px; stroke-width: 3.2; opacity: 0; }
.checkrow[aria-checked="true"] .box .icon { opacity: 1; }
.checkrow .lbl { flex: 1; }
.checkrow .who { color: var(--muted); font-size: var(--fs-sm); font-weight: 500; }
.checkrow.is-mine[aria-checked="false"]:not([disabled]) .box { border-color: var(--accent); }

/* ---------- forms ---------- */
.field { display: flex; flex-direction: column; gap: 8px; }
.field label { font-size: var(--fs-sm); color: var(--muted); font-weight: 700; }
.input {
  min-height: 52px;
  padding: 10px 14px;
  border: 2px solid var(--border);
  border-radius: var(--radius-btn);
  background: var(--surface);
  font-weight: 700;
  width: 100%;
}
.input:focus { border-color: var(--accent); outline: none; }
textarea.input { resize: vertical; min-height: 80px; }
.amount-input { display: flex; align-items: center; position: relative; }
.amount-input .yen { position: absolute; left: 14px; color: var(--muted); font-weight: 700; }
.amount-input .input { padding-left: 36px; text-align: right; font-variant-numeric: tabular-nums; font-size: var(--fs-xl); font-weight: 800; }
.amount-input.big .yen { font-size: var(--fs-xl); left: 18px; }
.amount-input.big .input { min-height: 84px; padding-left: 56px; font-size: var(--fs-amount-xl); line-height: 1.1; }
.hint { font-size: var(--fs-sm); color: var(--attention); font-weight: 700; min-height: 1.4em; }
.hint:empty { min-height: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 48px;
  padding: 0 16px;
  border-radius: var(--radius-btn);
  border: 2px solid var(--border);
  border-bottom-width: 4px;
  background: var(--surface);
  color: var(--text);
  font-size: var(--fs-sm);
  font-weight: 700;
}
.chip .icon { width: 22px; height: 22px; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
.chip[aria-pressed="true"] .icon { color: var(--accent-ink); }
.chip:active { transform: translateY(2px); border-bottom-width: 2px; }
@media (prefers-reduced-motion: reduce) {
  .chip:active { transform: none; }
}
.toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 52px;
  width: 100%;
  background: none;
  border: 0;
  padding: 0;
  text-align: left;
  font-weight: 700;
}
.toggle .sw {
  width: 52px;
  height: 30px;
  border-radius: 999px;
  background: var(--edge);
  position: relative;
  flex-shrink: 0;
  transition: background-color var(--dur);
}
.toggle .sw::after {
  content: "";
  position: absolute;
  top: 3px; left: 3px;
  width: 24px; height: 24px;
  border-radius: 999px;
  background: var(--surface);
  transition: transform var(--dur);
}
.toggle[aria-checked="true"] .sw { background: var(--accent); }
.toggle[aria-checked="true"] .sw::after { transform: translateX(22px); }

/* ---------- decision panel ---------- */
.radio {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 52px;
  width: 100%;
  background: none;
  border: 0;
  padding: 4px 0;
  text-align: left;
  font-weight: 700;
}
.radio .dot {
  width: 26px; height: 26px;
  border-radius: 999px;
  border: 2px solid var(--edge);
  flex-shrink: 0;
  position: relative;
  background: var(--surface);
}
.radio[aria-checked="true"] .dot { border-color: var(--accent); }
.radio[aria-checked="true"] .dot::after {
  content: "";
  position: absolute;
  inset: 5px;
  border-radius: 999px;
  background: var(--accent);
}
.panel { display: flex; flex-direction: column; gap: 12px; }
.divider { border: 0; border-top: 2px solid var(--border); margin: 0; }

/* ---------- detail ---------- */
.detail-head { display: flex; flex-direction: column; gap: 8px; }
.detail-head .item-title { font-size: var(--fs-xl); font-weight: 800; }
.detail-head .big { font-size: 2.25rem; line-height: 1.2; }
.detail-head .pair { display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
.timeline { display: flex; flex-direction: column; gap: 8px; font-size: var(--fs-sm); }
.timeline .step { display: flex; gap: 12px; }
.timeline .step .d { color: var(--muted); min-width: 3.2em; font-variant-numeric: tabular-nums; font-weight: 700; }

/* ---------- history ---------- */
.monthnav { display: flex; align-items: center; justify-content: space-between; }
.monthnav .lbl { font-size: var(--fs-xl); font-weight: 800; }
.daygroup { display: flex; flex-direction: column; gap: 10px; }
.daylabel { font-size: var(--fs-sm); color: var(--muted); font-weight: 700; }

/* ---------- settings ---------- */
.settings-group { display: flex; flex-direction: column; gap: 4px; }
.setting-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; }
.setting-row .input { width: 130px; min-height: 44px; }

/* ---------- sheet / toast ---------- */
.scrim {
  position: fixed;
  inset: 0;
  background: var(--scrim);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 10;
  animation: fade var(--dur-sheet) ease-out;
}
.sheet {
  width: 100%;
  max-width: var(--maxw);
  background: var(--surface);
  border-radius: var(--radius-sheet) var(--radius-sheet) 0 0;
  padding: 14px var(--sx) calc(24px + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  gap: 16px;
  animation: up var(--dur-sheet) ease-out;
}
.sheet::before {
  content: "";
  width: 44px;
  height: 5px;
  border-radius: 3px;
  background: var(--border);
  align-self: center;
  margin-bottom: 8px;
}
.sheet h2 { font-size: var(--fs-xl); font-weight: 800; }
.sheet .actions { display: flex; flex-direction: column; gap: 10px; }
.toast {
  position: fixed;
  top: 68px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--accent-soft);
  color: var(--accent-ink);
  padding: 12px 20px;
  border-radius: 999px;
  font-size: var(--fs-sm);
  font-weight: 800;
  box-shadow: var(--shadow);
  z-index: 20;
  animation: fade var(--dur) ease-out;
  max-width: calc(100% - 32px);
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes up { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
.fade-in { animation: fade var(--dur) ease-out; }
.onboard { font-size: var(--fs-lg); font-weight: 700; line-height: 1.7; }

/* ---------- memo selection ---------- */
.selectrow {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  min-height: 60px;
  padding: 0;
  background: none;
  border: 0;
  text-align: left;
  color: inherit;
  cursor: pointer;
}
.selectrow .box {
  width: 32px;
  height: 32px;
  border-radius: 999px;
  border: 2px solid var(--edge);
  background: var(--surface);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--on-accent);
  flex-shrink: 0;
  transition: background-color var(--dur), border-color var(--dur);
}
.selectrow .box .icon { width: 18px; height: 18px; stroke-width: 3.2; opacity: 0; }
.selectrow[aria-checked="true"] .box { background: var(--accent); border-color: var(--accent); }
.selectrow[aria-checked="true"] .box .icon { opacity: 1; }
/* 選んだことは、地の色と枠と丸の塗りの3つで示す。色だけに頼らない。 */
.card.is-selected { background: var(--accent-soft); border-color: var(--accent); }
.memo-amount { font-size: var(--fs-amount); }
.memo-actions { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.memo-actions .when { margin-left: auto; font-size: var(--fs-xs); font-weight: 700; color: var(--muted); }
.memo-actions .btn { min-height: 40px; padding: 0 12px; font-size: var(--fs-sm); }

/* ---------- send bar ---------- */
.sendbar {
  position: sticky;
  isolation: isolate;
  bottom: var(--tabh);
  padding: 12px var(--sx) 16px;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.sendbar::before {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: 100%;
  height: 28px;
  background: linear-gradient(to top, var(--bg), transparent);
  pointer-events: none;
}
.sendrow { display: flex; align-items: center; gap: 12px; }
.sendrow .btn-primary { flex: 1; min-width: 0; width: auto; }
.btn-round {
  width: 60px;
  height: 60px;
  flex-shrink: 0;
  border-radius: var(--radius-btn);
  border: 2px solid var(--border);
  border-bottom-width: 5px;
  background: var(--surface);
  color: var(--accent-ink);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.btn-round:active { transform: translateY(3px); border-bottom-width: 2px; }
@media (prefers-reduced-motion: reduce) {
  .btn-round:active { transform: none; }
}
.btn-round .icon { width: 26px; height: 26px; stroke-width: 3; }

/* ---------- batch ---------- */
.batch {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.batch-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-bottom: 4px;
}
.batch-head .from { font-size: var(--fs-lg); font-weight: 800; }
.batch-head .count { color: var(--muted); font-size: var(--fs-sm); font-weight: 700; }
.batch-line {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 60px;
  padding: 0;
  background: none;
  border: 0;
  text-align: left;
  color: inherit;
  cursor: pointer;
  font-weight: 700;
}
.batch-line .grow { flex: 1; min-width: 0; font-size: var(--fs-md); }
.batch-line .amount { font-size: var(--fs-lg); }
.batch-foot { padding-top: 6px; display: flex; flex-direction: column; gap: 10px; }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* ---------- notice ---------- */
.notice {
  background: var(--attention-soft);
  color: var(--attention);
  border-radius: var(--radius);
  padding: 14px 16px;
  font-size: var(--fs-sm);
  font-weight: 700;
}
.notice .btn-text { color: var(--attention); text-decoration: underline; }

/* ---------- pairing ---------- */
.pair { display: flex; flex-direction: column; gap: 20px; padding-block: 8px; }
.code {
  font-size: 2.5rem;
  font-weight: 800;
  letter-spacing: 0.22em;
  text-align: center;
  font-variant-numeric: tabular-nums;
  background: var(--accent-soft);
  color: var(--accent-ink);
  border-radius: var(--radius);
  padding: 20px 12px 20px 20px;
}
.steps { display: flex; flex-direction: column; gap: 16px; }
.step-row { display: flex; gap: 12px; align-items: flex-start; }
.step-row .n {
  width: 28px; height: 28px; flex-shrink: 0;
  border-radius: 999px;
  background: var(--accent-soft); color: var(--accent-ink);
  font-size: var(--fs-sm); font-weight: 800;
  display: inline-flex; align-items: center; justify-content: center;
}
.step-row.is-done .n { background: var(--positive-soft); color: var(--positive); }
.step-row .body { flex: 1; font-size: var(--fs-sm); }
.step-row .body strong { font-weight: 800; font-size: var(--fs-md); display: block; }
.bigpad { padding: 24px var(--sx); }
.err { color: var(--attention); font-size: var(--fs-sm); font-weight: 700; min-height: 1.4em; }
.center { text-align: center; }

/* ---------- 渡す側は一段落ち着かせる ---------- */
/* 骨格と書体と緑は共通のまま、厚みと文字の大きさだけ抑える。 */
[data-side="mother"] .topbar .title { font-size: var(--fs-xl); }
[data-side="mother"] .item-icon { width: 40px; height: 40px; }
[data-side="mother"] .item-icon .icon { width: 21px; height: 21px; }
[data-side="mother"] .card .item-title { font-size: var(--fs-md); }
[data-side="mother"] .card .item-amount { font-size: var(--fs-lg); }
[data-side="mother"] .btn-3d:not(.btn-primary) { border-bottom-width: 2px; }
[data-side="mother"] .btn-3d:not(.btn-primary):active { transform: none; border-bottom-width: 2px; }
[data-side="mother"] .chip { border-bottom-width: 2px; }
[data-side="mother"] .chip:active { transform: none; border-bottom-width: 2px; }
</style>
</head>

<div id="app"><main class="main"><p class="muted">読み込んでいます…</p></main></div>
<div id="overlay"></div>
<script type="module" src="./app.js"></script>
</body>
